<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Visitor Form</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="stylesheet" href="styles/form.css" />
</head>

<body>

  <div id="validation">
    <h1>Visitor Form</h1>

    <form id="visitorForm">
        <h2>Personal Information</h2>
        <label class="label" class="label" for="firstName">First Name</label>
        <input class="input" id="firstName" name="firstName">
        <label class="label" class="label" for="lastName">Last Name</label>
        <input class="input" id="lastName" name="lastName">
        <label class="label" for="address">Address</label>
        <input class="input" id="address" name="address">
        <label class="label" for="city">City</label>
        <input class="input" id="city" name="city">
        <label class="label" for="state">State</label>
        <input class="input" id="state" name="state">
        <label class="label" for="zip">Zip</label>
        <input class="input" id="zip" name="zip">
        <label class="label" for="phone">Phone number</label>
        <input class="input" id="phone" name="phone" type="tel">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email">

        <h3>How did you find my page?</h3>
        <div id="checkbox">
            <label class="label">
                <input type="checkbox" name="hear" value="Google">
                <span>Google</span>
            </label>
            <label class="label">
                <input type="checkbox" name="hear" value="Friend">
                <span>Friend</span>
            </label>
            <label class="label">
                <input type="checkbox" name="hear" value="Work">
                <span>Work</span>
            </label>
            <label class="label">
                <input type="checkbox" name="hear" value="School">
                <span>School</span>
            </label>
            
        </div>

        <label class="label" for="comments">Comments</label>
        <textarea id="comments" cols="50" rows="3" placeholder="Share your thoughts..."></textarea>
        <input id="submit" name="submit" type="submit">
    </form>
  </div>

</html>
