<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Visitor Form</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="stylesheet" href="styles/form.css" />
</head>

<body>
  <a href="index.html">Home</a>
  <div class="masterDiv">
    <h1>Visitor Form</h1>

    <div id="validation">    
      <form id="visitorForm" novalidate>
          <h2>Personal Information</h2>
          <label class="label" class="label" for="firstName">First Name</label>
          <input class="input" id="firstName" name="firstName" required>
          <span class="error"></span>
          <label class="label" class="label" for="lastName">Last Name</label>
          <input class="input" id="lastName" name="lastName" required>
          <span class="error"></span>
          <label class="label" for="address">Address</label>
          <input class="input" id="address" name="address" required>
          <span class="error"></span>
          <label class="label" for="city">City</label>
          <input class="input" id="city" name="city" required>
          <span class="error"></span>
          <label for="state" class="label">State</label>
          <select id="state" name="state" class="input" required>
            <option value="">-- Select a state --</option>
            <option value="AL">Alabama</option>
            <option value="AK">Alaska</option>
            <option value="AZ">Arizona</option>
            <option value="AR">Arkansas</option>
            <option value="CA">California</option>
            <option value="CO">Colorado</option>
            <option value="CT">Connecticut</option>
            <option value="DE">Delaware</option>
            <option value="FL">Florida</option>
            <option value="GA">Georgia</option>
            <option value="HI">Hawaii</option>
            <option value="ID">Idaho</option>
            <option value="IL">Illinois</option>
            <option value="IN">Indiana</option>
            <option value="IA">Iowa</option>
            <option value="KS">Kansas</option>
            <option value="KY">Kentucky</option>
            <option value="LA">Louisiana</option>
            <option value="ME">Maine</option>
            <option value="MD">Maryland</option>
            <option value="MA">Massachusetts</option>
            <option value="MI">Michigan</option>
            <option value="MN">Minnesota</option>
            <option value="MS">Mississippi</option>
            <option value="MO">Missouri</option>
            <option value="MT">Montana</option>
            <option value="NE">Nebraska</option>
            <option value="NV">Nevada</option>
            <option value="NH">New Hampshire</option>
            <option value="NJ">New Jersey</option>
            <option value="NM">New Mexico</option>
            <option value="NY">New York</option>
            <option value="NC">North Carolina</option>
            <option value="ND">North Dakota</option>
            <option value="OH">Ohio</option>
            <option value="OK">Oklahoma</option>
            <option value="OR">Oregon</option>
            <option value="PA">Pennsylvania</option>
            <option value="RI">Rhode Island</option>
            <option value="SC">South Carolina</option>
            <option value="SD">South Dakota</option>
            <option value="TN">Tennessee</option>
            <option value="TX">Texas</option>
            <option value="UT">Utah</option>
            <option value="VT">Vermont</option>
            <option value="VA">Virginia</option>
            <option value="WA">Washington</option>
            <option value="WV">West Virginia</option>
            <option value="WI">Wisconsin</option>
            <option value="WY">Wyoming</option>
          </select>
          <span class="error"></span>
          <label class="label" for="zip">Zip</label>
          <input class="input" id="zip" name="zip" required>
          <span class="error"></span>
          <label class="label" for="phone">Phone number</label>
          <input class="input" id="phone" name="phone" type="tel" required>
          <span class="error"></span>
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required>
          <span class="error"></span>

          <h3>How did you find my page?</h3>
          <div id="checkbox">
              <label class="label">
                  <input type="checkbox" name="hear" value="Google">
                  <span>Google</span>
              </label>
              <label class="label">
                  <input type="checkbox" name="hear" value="Friend">
                  <span>Friend</span>
              </label>
              <label class="label">
                  <input type="checkbox" name="hear" value="Work">
                  <span>Work</span>
              </label>
              <label class="label">
                  <input type="checkbox" name="hear" value="School">
                  <span>School</span>
              </label>
              <label class="label">
                  <input type="checkbox" name="hear" value="Other">
                  <span>Other</span>
              </label>
          </div>
          <span class="error"></span>

          <label class="label" for="comments">Comments</label>
          <textarea id="comments" name="comments" cols="50" rows="3" placeholder="Share your thoughts..."></textarea>
          <button id="submit" type="submit">Submit</button>
      </form>
    </div>
  </div>

  <script src="validation.js"></script>
  <script src="main.js"></script>

</html>
